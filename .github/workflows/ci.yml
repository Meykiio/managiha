name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gate (lint, types, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # One command, the same one a developer runs locally. If these ever diverge,
      # "it passes locally" stops meaning anything.
      - name: Gate
        run: npm run gate

      - name: Dead code and unused dependencies
        run: npm run knip

  e2e:
    name: E2E and accessibility (axe, both themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds, then serves on 127.0.0.1 and runs axe against every public route
      # in both themes and in RTL.
      - name: Accessibility suite
        run: npm run gate:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Secrets, static analysis, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans commits, not just the working tree, so a
          # shallow clone would miss a secret that was later removed.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # Registry rulesets for the generic classes, plus .semgrep.yml for the
          # invariants only this project has: no client write to current_stock or
          # balance, no dangerouslySetInnerHTML, no eval, no service_role key in the
          # bundle, no translated label baked onto a data structure in src/lib.
          config: >-
            .semgrep.yml
            p/owasp-top-ten
            p/typescript
            p/react

      - name: Trivy (vulnerabilities, secrets, misconfig)
        # Pinned to the version the action's own README documents, and the Trivy
        # binary is pinned too so a scan result is reproducible rather than a
        # function of whatever shipped that week.
        #
        # The tag MUST keep its `v` prefix. `aquasecurity/trivy-action@0.28.0`
        # resolves to nothing, and a step that cannot resolve its action fails
        # before it runs — which silently skipped the dependency audit below it
        # and marked every CI run red.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.76.0

      # Gates on what actually ships.
      #
      # `--omit=dev` is deliberate, not a way of making a red check green. The
      # measured position when this was written: production dependencies carry
      # **zero** high or critical advisories and two moderate ones (react-router,
      # fixable only by the react-router 7 migration that is already planned and
      # deferred). Every one of the 27 high and 2 critical advisories in this
      # repository is in the build toolchain — Tailwind's file watcher,
      # Lighthouse's browser downloader, glob libraries — and none of it reaches a
      # browser or a user.
      #
      # Those advisories are real, and Dependabot opens pull requests for them.
      # But gating a merge on findings that cannot be fixed without a breaking
      # framework migration produces a permanently red check, and a permanently
      # red check is one nobody reads — which is exactly how this job went
      # unnoticed while it was failing on every run.
      #
      # To see the full picture including dev, run `npm audit` locally.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
